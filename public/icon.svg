<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="woodBg" cx="50%" cy="42%" r="72%">
      <stop offset="0%" stop-color="#6b4225" />
      <stop offset="65%" stop-color="#3e2414" />
      <stop offset="100%" stop-color="#1a120b" />
    </radialGradient>
    <linearGradient id="brassFrame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#d9a12b" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <radialGradient id="goldBall" cx="34%" cy="28%" r="68%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="22%" stop-color="#fde047" />
      <stop offset="62%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#713f12" />
    </radialGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#090503" flood-opacity="0.82" />
    </filter>
  </defs>

  <!-- Rounded dark-wood & gold square -->
  <rect width="512" height="512" rx="96" fill="url(#woodBg)" />
  <rect x="26" y="26" width="460" height="460" rx="76" fill="none" stroke="url(#brassFrame)" stroke-width="14" />

  <!-- Carved Labyrinth Road Grooves -->
  <g stroke="#140c06" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M118 118 L394 118 L394 236 L256 236 L256 320" />
    <path d="M118 118 L118 332 L212 332" />
    <path d="M118 228 L256 228" />
    <path d="M394 236 L394 344 L318 344" />
  </g>
  <g stroke="#b47b44" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.52">
    <path d="M118 118 L394 118 L394 236 L256 236 L256 320" />
    <path d="M118 118 L118 332 L212 332" />
    <path d="M118 228 L256 228" />
    <path d="M394 236 L394 344 L318 344" />
  </g>

  <!-- Odra River inlay -->
  <path d="M342 54 Q314 148 332 232 T324 378" stroke="#3898d4" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.82" />

  <!-- Center 3D Golden Marble -->
  <circle cx="256" cy="228" r="64" fill="url(#goldBall)" filter="url(#drop)" />
  <ellipse cx="232" cy="198" rx="22" ry="13" transform="rotate(-28 232 198)" fill="#ffffff" opacity="0.82" />
  <circle cx="276" cy="252" r="8" fill="#fef08a" opacity="0.45" />

  <!-- White Initials AW at the bottom -->
  <g filter="url(#drop)">
    <text
      x="256"
      y="444"
      text-anchor="middle"
      font-family="'Outfit', 'Plus Jakarta Sans', Arial, sans-serif"
      font-weight="800"
      font-size="78"
      letter-spacing="10"
      fill="#ffffff"
    >AW</text>
  </g>
</svg>
