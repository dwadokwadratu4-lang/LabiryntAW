<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="woodBg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#5a3821" />
      <stop offset="65%" stop-color="#3a2213" />
      <stop offset="100%" stop-color="#22130a" />
    </radialGradient>
    <linearGradient id="brassFrame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6df8c" />
      <stop offset="50%" stop-color="#c99a32" />
      <stop offset="100%" stop-color="#8a6318" />
    </linearGradient>
    <radialGradient id="goldBall" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#fff9d6" />
      <stop offset="28%" stop-color="#f7cf52" />
      <stop offset="72%" stop-color="#c78b18" />
      <stop offset="100%" stop-color="#6e4606" />
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0d0704" flood-opacity="0.75" />
    </filter>
  </defs>

  <!-- Full-bleed wooden background -->
  <rect width="512" height="512" rx="96" fill="url(#woodBg)" />

  <!-- Subtle wood grain lines -->
  <g stroke="#29170c" stroke-width="4" opacity="0.45" fill="none">
    <path d="M0 80 Q180 65 512 88" />
    <path d="M0 165 Q260 182 512 155" />
    <path d="M0 340 Q210 322 512 350" />
    <path d="M0 430 Q300 445 512 422" />
  </g>

  <!-- Safe-zone inner brass frame -->
  <rect x="48" y="48" width="416" height="416" rx="64" fill="none" stroke="url(#brassFrame)" stroke-width="10" />

  <!-- Carved Labyrinth Grooves -->
  <g stroke="#1b0f08" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M128 136 L256 136 L256 232 L376 232 L376 368" />
    <path d="M128 136 L128 368 L268 368" />
    <path d="M256 232 L128 232" />
  </g>
  <g stroke="#7a5233" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.45">
    <path d="M128 136 L256 136 L256 232 L376 232 L376 368" />
    <path d="M128 136 L128 368 L268 368" />
    <path d="M256 232 L128 232" />
  </g>

  <!-- Odra River inlay -->
  <path d="M326 68 Q300 180 318 280 T300 444" stroke="#2f7db3" stroke-width="14" stroke-linecap="round" fill="none" opacity="0.85" />

  <!-- Target Hole with emerald-gold rim -->
  <circle cx="376" cy="368" r="24" fill="#0d0704" stroke="#22c55e" stroke-width="6" />

  <!-- Golden Marble -->
  <circle cx="256" cy="232" r="44" fill="url(#goldBall)" filter="url(#shadow)" />
  <ellipse cx="238" cy="212" rx="14" ry="9" transform="rotate(-25 238 212)" fill="#ffffff" opacity="0.72" />

  <!-- Brass Plaque with Initials AW -->
  <g filter="url(#shadow)">
    <rect x="176" y="334" width="160" height="68" rx="14" fill="#1b1410" stroke="url(#brassFrame)" stroke-width="5" />
    <text x="256" y="381" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="38" letter-spacing="6" fill="url(#brassFrame)">AW</text>
  </g>
</svg>
